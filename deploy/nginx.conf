# nginx site for the Avana Medical website. __DOMAIN__ is filled in by setup.sh.
# certbot adds the HTTPS (443) block and the HTTP→HTTPS redirect when you run: certbot --nginx -d __DOMAIN__
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Event photos can be large straight off a phone; the server shrinks them to ~150 KB
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
